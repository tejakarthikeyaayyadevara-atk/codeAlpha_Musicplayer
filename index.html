<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Music App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="auth-overlay" class="overlay-container">
        <div class="auth-card">
            <h2><i class="fas fa-music"></i> Symphony Stream</h2>
            <p id="auth-subtitle">Enter your phone number to login or register</p>
            
            <div id="phone-input-group" class="input-wrapper">
                <div class="phone-row">
                    <span class="country-code">+91</span>
                    <input type="tel" id="user-phone" placeholder="Enter 10-digit number" maxlength="10">
                </div>
                <button class="btn-primary" onclick="requestOTP()">Generate OTP</button>
            </div>

            <div id="otp-input-group" class="input-wrapper hidden">
                <input type="text" id="user-otp" placeholder="Enter 6-digit OTP" maxlength="6">
                <button class="btn-primary" onclick="verifyOTP()">Verify & Login</button>
                <p class="resend-text">Didn't get code? <span onclick="requestOTP()">Resend</span></p>
            </div>
        </div>
    </div>

    <div class="app-container hidden" id="main-app">
        
        <aside class="sidebar">
            <div class="user-profile-badge">
                <i class="fas fa-user-circle"></i>
                <span id="display-user-phone">Logged In</span>
            </div>
            
            <div class="playlist-manager">
                <h3>My Library</h3>
                <div class="create-playlist-row">
                    <input type="text" id="new-playlist-name" placeholder="New Playlist Name...">
                    <button onclick="createNewPlaylist()"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="custom-playlists-ul">
                    </ul>
            </div>
        </aside>

        <main class="main-content">
            <header class="search-header">
                <div class="search-bar-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="app-search-input" placeholder="Search track titles or artists..." oninput="handleSearch(event)">
                </div>
            </header>

            <div class="content-body-layout">
                <div class="music-card-deck">
                    <div class="track-details">
                        <div class="track-art" id="track-art"></div>
                        <h2 id="track-title">Song Title</h2>
                        <p id="track-artist">Artist Name</p>
                    </div>

                    <audio id="main-audio" src=""></audio>

                    <div class="progress-container">
                        <div class="time-stamps">
                            <span id="current-time">0:00</span>
                            <span id="total-duration">0:00</span>
                        </div>
                        <input type="range" id="progress-slider" min="0" max="100" value="0" step="1">
                    </div>

                    <div class="media-controls">
                        <button id="btn-prev" class="ctrl-btn"><i class="fas fa-backward"></i></button>
                        <button id="btn-play-pause" class="ctrl-btn main-play"><i class="fas fa-play"></i></button>
                        <button id="btn-next" class="ctrl-btn"><i class="fas fa-forward"></i></button>
                    </div>

                    <div class="ringtone-cutter-box">
                        <h3><i class="fas fa-cut"></i> 30s Ringtone Generator</h3>
                        <div class="cutter-controls">
                            <input type="number" id="start-time-input" min="0" value="0" placeholder="Secs">
                            <button id="btn-make-ringtone" class="btn-slice" onclick="createRingtone()">
                                <i class="fas fa-download"></i> Cut Track
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tracks-directory-panel">
                    <h3 id="directory-heading">All Available Tracks</h3>
                    <ul id="playlist-ul">
                        </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
